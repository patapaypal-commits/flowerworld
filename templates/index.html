{% extends "base.html" %}

{% block title %}Flowerworld — Seasonal Botanicals{% endblock %}

{% block content %}
<section class="hero--video">
    <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        poster="{{ url_for('static', filename='videos/hero-poster.jpg') }}">
        <source src="{{ url_for('static', filename='videos/hero.mp4') }}" type="video/mp4">
    </video>

    <div class="hero-overlay"></div>

    <div class="hero-content">
        <h1 class="hero-title">Seasonal botanicals, thoughtfully arranged.</h1>
        <p class="hero-subtitle">
            Dried flowers, seasonal wreaths, and hand-tied arrangements
            for the quiet luxury of autumn.
        </p>
        <a href="/shop" class="btn">Explore the collection</a>
    </div>
</section>
{% endblock %}
